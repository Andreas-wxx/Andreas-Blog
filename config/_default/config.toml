# Change baseurl before deploy
baseurl      = "https://Andreas-wxx.github.io/Andreas-Blog/"
languageCode = "zh-cn"
title        = "Andreas' Blog"

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "zh"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Disqus 短名：这里原本是主题作者 demo 站的 "hugo-theme-stack"，本站无权使用，
# 会让每篇文章都报 "We were unable to load Disqus."。
# 换成你在 disqus.com 注册的短名后，把 params.toml 里 [comments] enabled 改回 true。
# disqusShortname = "your-shortname"

[pagination]
    pagerSize = 10


